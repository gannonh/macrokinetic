name: JabTracker
options:
  bundleIdPrefix: com.gannonhall
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  createIntermediateGroups: true
  xcodeVersion: "26.2"
  fileTypes:
    "icon":
      file: true
settings:
  base:
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ZBZKKWF95G
    SWIFT_EMIT_LOC_STRINGS: YES
  
targets:
  JabTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JabTracker
        excludes:
          - "**/.swiftlint.yml"
    resources:
      - path: JabTracker/Assets.xcassets
        optional: true
      - path: JabTracker/AppIcon.icon
        optional: true
      - path: JabTracker/Resources/usda_foods.sqlite
      - path: JabTrackerStoreKit.storekit
    settings:
      CURRENT_PROJECT_VERSION: "1"
      MARKETING_VERSION: "1.0"
      TARGETED_DEVICE_FAMILY: 1
      ENABLE_PREVIEWS: NO
      CODE_SIGN_ENTITLEMENTS: JabTracker/JabTracker.entitlements
      CODE_SIGN_STYLE: Automatic
      INFOPLIST_FILE: JabTracker/Info.plist
      
  JabTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [JabTrackerTests]
    settings:
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: JabTracker

  JabTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [JabTrackerUITests]
    resources:
      - path: JabTrackerStoreKit.storekit
    settings:
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: JabTracker

schemes:
  JabTracker:
    build:
      targets:
        JabTracker: all
        JabTrackerTests: [test]
        JabTrackerUITests: [test]
    test:
      targets:
        - name: JabTrackerTests
          parallelizable: false
        - name: JabTrackerUITests
          parallelizable: true
          randomExecutionOrder: true
      commandLineArguments:
        "--bypass-onboarding": true
        "--force-onboarding": false
        "--reset-app-data": false
        "--ui-testing": true
        "--seed-test-7d": false
        "--seed-test-30d": false
        "--seed-test-90d": false
        "--seed-test-1y": false
        "--seed-check-in-ready": false
        "--seed-check-in-good": false
        "--seed-check-in-minimum": false
        "--seed-check-in-insufficient": false
        "--seed-collaborative": false
    run:
      commandLineArguments:
        "--force-onboarding": false # resets onboarding if true
        "--reset-app-data": true # seeding only works if true
        "--ui-testing": true # Enable to bypasses auth AND auto-complete onboarding 
        "--seed-test-7d": false
        "--seed-test-30d": false
        "--seed-test-90d": false
        "--seed-test-1y": false
        "--test-titration-data": false
        "--seed-check-in-ready": true  # Seeds goal/program with check-in due (excellent tier)
        "--seed-check-in-good": false  # Seeds goal/program with good data tier
        "--seed-check-in-minimum": false  # Seeds goal/program with minimum data tier
        "--seed-check-in-insufficient": false  # Seeds goal/program with insufficient data (check-in blocked)
        "--seed-collaborative": true  # Use Collaborative program style (default: Coached)
      storeKitConfiguration: JabTrackerStoreKit.storekit