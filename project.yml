name: JabTracker
options:
  bundleIdPrefix: com.gannonhall
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  createIntermediateGroups: true
  
targets:
  JabTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JabTracker
        excludes:
          - "*.xcassets"
    resources:
      - path: JabTracker/Assets.xcassets
    settings:
      GENERATE_INFOPLIST_FILE: YES
      CURRENT_PROJECT_VERSION: "1"
      MARKETING_VERSION: "1.0"
      INFOPLIST_KEY_CFBundleDisplayName: JabTracker
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.medical
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
      TARGETED_DEVICE_FAMILY: 1
      ENABLE_PREVIEWS: NO
      CODE_SIGN_ENTITLEMENTS: JabTracker/JabTracker.entitlements
      DEVELOPMENT_TEAM: WLXX9L7UL
      
  JabTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [JabTrackerTests]
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: JabTracker
      
  JabTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [JabTrackerUITests]
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: JabTracker

schemes:
  JabTracker:
    build:
      targets:
        JabTracker: all
        JabTrackerTests: [test]
        JabTrackerUITests: [test]
    test:
      targets:
        - JabTrackerTests
        - JabTrackerUITests