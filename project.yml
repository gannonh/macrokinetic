name: JabTracker
options:
  bundleIdPrefix: com.gannonhall
  deploymentTarget:
    iOS: "17.5"
  defaultConfig: Debug
  createIntermediateGroups: true
  xcodeVersion: "26.5"
  fileTypes:
    "icon":
      file: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    # Version numbering for TestFlight and App Store - 
    # MARKETING_VERSION: User-facing version (e.g., 1.0.0, 1.1.0)
    # CURRENT_PROJECT_VERSION: Build number -- increment with each upload (1, 2, 3...)
    MARKETING_VERSION: "0.10.1"
    CURRENT_PROJECT_VERSION: "16"
    IPHONEOS_DEPLOYMENT_TARGET: "17.5"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: false
    SWIFT_EMIT_LOC_STRINGS: true
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: true
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true
    ENABLE_USER_SCRIPT_SANDBOXING: true
    DEVELOPMENT_TEAM: ZBZKKWF95G
  
targets:
  JabTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.5"
    sources:
      - path: JabTracker
        excludes:
          - "**/.swiftlint.yml"
    resources:
      - path: JabTracker/Assets.xcassets
        optional: true
      - path: JabTracker/AppIcon.icon
        optional: true
      - path: JabTracker/Resources/usda_foods.sqlite
      - path: JabTrackerStoreKit.storekit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.gannonhall.JabTracker
      CODE_SIGN_ENTITLEMENTS: JabTracker/JabTracker.entitlements
      CODE_SIGN_STYLE: Automatic
      INFOPLIST_FILE: JabTracker/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_PREVIEWS: true
      SWIFT_EMIT_LOC_STRINGS: true
      
  JabTrackerUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JabTrackerTests
        excludes:
          - "Onboarding/Legacy/**"
          - AnalyticsServiceIntegrationTests.swift
          - AuthenticationDatabaseIntegrationTests.swift
          - AuthenticationDelegateIntegrationTests.swift
          - DataControllerBasicTests.swift
          - DataControllerCloudKitTests.swift
          - DataControllerInitializationTests.swift
          - DataControllerPreviewTests.swift
          - DataControllerSyncTests.swift
          - DataControllerTestDataTests.swift
          - DataControllerTests.swift
          - Integration/CalendarPerformanceTests.swift
          - NotificationServicePersistenceTests.swift
          - PKDashboardIntegrationTests.swift
          - PersistenceTests.swift
          - ScheduleServiceSplitDoseIntegrationTests.swift
          - Services/ChartDataProcessorIntegrationTests.swift
          - Services/ChartDataProcessorPerformanceTests.swift
          - Services/FoodServiceCustomFoodIntegrationTests.swift
          - Services/LocalFoodDatabaseTests.swift
          - Services/TDEEServiceIntegrationTests.swift
          - SettingsViewNotificationIntegrationTests.swift
          - StoreKitConfigurationTests.swift
          - SubscriptionManagerRestoreIntegrationTests.swift
          - SubscriptionManagerStoreKitIntegrationTests.swift
    settings:
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: JabTracker

  JabTrackerIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JabTrackerTests
        includes:
          - AnalyticsServiceIntegrationTests.swift
          - AuthenticationDatabaseIntegrationTests.swift
          - AuthenticationDelegateIntegrationTests.swift
          - DataControllerBasicTests.swift
          - DataControllerCloudKitTests.swift
          - DataControllerInitializationTests.swift
          - DataControllerPreviewTests.swift
          - DataControllerSyncTests.swift
          - DataControllerTestDataTests.swift
          - DataControllerTests.swift
          - Helpers/CustomFoodTestHelpers.swift
          - Integration/CalendarPerformanceTests.swift
          - Mocks/MockActiveEnergyDataSource.swift
          - Mocks/MockNotificationCenter.swift
          - NotificationServicePersistenceTests.swift
          - PKDashboardIntegrationTests.swift
          - PersistenceTests.swift
          - ScheduleServiceSplitDoseIntegrationTests.swift
          - Services/ChartDataProcessorIntegrationTests.swift
          - Services/ChartDataProcessorPerformanceTests.swift
          - Services/FoodServiceCustomFoodIntegrationTests.swift
          - Services/LocalFoodDatabaseTests.swift
          - Services/TDEEServiceIntegrationTests.swift
          - SettingsViewNotificationIntegrationTests.swift
          - StoreKitConfigurationTests.swift
          - SubscriptionManagerRestoreIntegrationTests.swift
          - SubscriptionManagerStoreKitIntegrationTests.swift
          - Utilities/TestError.swift
    resources:
      - path: JabTrackerStoreKit.storekit
    settings:
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: JabTracker

  JabTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: JabTrackerUITests
        excludes:
          - Nutrition/FoodSearchReleaseBenchmarkUITests.swift
    resources:
      - path: JabTrackerStoreKit.storekit
    settings:
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: JabTracker

  JabTrackerFoodSearchBenchmarkTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: JabTrackerUITests/Utils/TestUtilities.swift
      - path: JabTrackerUITests/Utils/TestUtilities+ElementTypes.swift
      - path: JabTrackerUITests/Nutrition/FoodSearchReleaseBenchmarkUITests.swift
    settings:
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: JabTracker

schemes:
  JabTracker:
    build:
      targets:
        JabTracker: all
        JabTrackerUnitTests: [test]
        JabTrackerIntegrationTests: [test]
        JabTrackerUITests: [test]
    test:
      targets:
        - name: JabTrackerUnitTests
          parallelizable: true
        - name: JabTrackerIntegrationTests
          parallelizable: false
        - name: JabTrackerUITests
          parallelizable: true
          randomExecutionOrder: true
      storeKitConfiguration: JabTrackerStoreKit.storekit
      commandLineArguments:
        "--bypass-onboarding": true
        "--force-onboarding": false
        "--reset-app-data": false
        "--ui-testing": true
        "--seed-test-7d": false
        "--seed-test-30d": false
        "--seed-test-90d": false
        "--seed-test-1y": false
        "--seed-test-1y-high": false
        "--seed-test-1y-medium": false
        "--seed-test-1y-low": false
        "--seed-test-new-user": false
        "--seed-check-in-ready": false
        "--seed-check-in-good": false
        "--seed-check-in-minimum": false
        "--seed-check-in-insufficient": false
        "--seed-collaborative": false
        "--seed-3-day-active": false
        "--seed-5-day-active": false
        "--seed-2-week-active": false
        "--seed-1-month-active": false
        "--seed-90-day-active": false
    run:
      commandLineArguments: # SIM VERSION ---------------------------------------
        "--force-onboarding": false # resets onboarding if true
        "--reset-app-data": true # seeding only works if true
        "--ui-testing": true # Enable to bypasses auth AND auto-complete onboarding
        "--disable-cloudkit": false # Disable iCloud sync for local debugging 
        "--seed-test-7d": false # medication history seeding 
        "--seed-test-30d": false # medication history seeding 
        "--seed-test-90d": false # medication history seeding 
        "--seed-test-1y": false # medication history seeding
        "--test-titration-data": false  # medication  titration data seeding
        "--seed-test-1y-high": false # 1 year with high quality data (complete daily logging)
        "--seed-test-1y-medium": false # 1 year with medium quality data (4-5 days/week)
        "--seed-test-1y-low": false # 1 year with low quality data (1-2 days/week)
        "--seed-test-new-user": false # new user - today only data
        "--seed-check-in-ready": false  # Seeds goal/program with check-in due (excellent tier)
        "--seed-check-in-good": false  # Seeds goal/program with good data tier
        "--seed-check-in-minimum": false  # Seeds goal/program with minimum data tier
        "--seed-check-in-insufficient": false  # Seeds goal/program with insufficient data (check-in blocked)
        "--seed-collaborative": false  # Use Collaborative program style (default: Coached)
        "--seed-3-day-active": false  # 3 days food/weight + 0 doses
        "--seed-5-day-active": false  # 5 days food/weight + 1 dose
        "--seed-2-week-active": true  # 14 days food/weight + 2 doses
        "--seed-1-month-active": false  # 30 days food/weight + 4 doses
        "--seed-90-day-active": false  # 90 days food/weight + 13 doses
      storeKitConfiguration: JabTrackerStoreKit.storekit
      # commandLineArguments: # DEVICE VERSION FOR UAT ---------------------------------------
      #   "--force-onboarding": false # resets onboarding if true
      #   "--reset-app-data": false # seeding only works if true
      #   "--ui-testing": false # Enable to bypasses auth AND auto-complete onboarding
      #   "--disable-cloudkit": false # Disable iCloud sync for local debugging 
      #   "--seed-test-7d": false # medication history seeding 
      #   "--seed-test-30d": false # medication history seeding 
      #   "--seed-test-90d": false # medication history seeding 
      #   "--seed-test-1y": false # medication history seeding
      #   "--test-titration-data": false  # medication  titration data seeding
      #   "--seed-test-1y-high": false # 1 year with high quality data (complete daily logging)
      #   "--seed-test-1y-medium": false # 1 year with medium quality data (4-5 days/week)
      #   "--seed-test-1y-low": false # 1 year with low quality data (1-2 days/week)
      #   "--seed-test-new-user": false # new user - today only data
      #   "--seed-check-in-ready": false  # Seeds goal/program with check-in due (excellent tier)
      #   "--seed-check-in-good": false  # Seeds goal/program with good data tier
      #   "--seed-check-in-minimum": false  # Seeds goal/program with minimum data tier
      #   "--seed-check-in-insufficient": false  # Seeds goal/program with insufficient data (check-in blocked)
      #   "--seed-collaborative": false  # Use Collaborative program style (default: Coached)
      #   "--seed-3-day-active": false  # 3 days food/weight + 0 doses
      #   "--seed-5-day-active": false  # 5 days food/weight + 1 dose
      #   "--seed-2-week-active": false  # 14 days food/weight + 2 doses
      #   "--seed-1-month-active": false  # 30 days food/weight + 4 doses
      #   "--seed-90-day-active": false  # 90 days food/weight + 13 doses
      # storeKitConfiguration: JabTrackerStoreKit.storekit

  JabTrackerFoodSearchBenchmark:
    build:
      targets:
        JabTracker: all
        JabTrackerFoodSearchBenchmarkTests: [test]
    test:
      config: Release
      targets:
        - name: JabTrackerFoodSearchBenchmarkTests
          parallelizable: false
      commandLineArguments:
        "--bypass-onboarding": true
        "--ui-testing": true

  JabTrackerUnitTests:
    build:
      targets:
        JabTracker: all
        JabTrackerUnitTests: [test]
    test:
      targets:
        - name: JabTrackerUnitTests
          parallelizable: true

  JabTrackerIntegrationTests:
    build:
      targets:
        JabTracker: all
        JabTrackerIntegrationTests: [test]
    test:
      targets:
        - name: JabTrackerIntegrationTests
          parallelizable: false
      storeKitConfiguration: JabTrackerStoreKit.storekit
