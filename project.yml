name: JabTracker
options:
  bundleIdPrefix: com.gannonhall
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  createIntermediateGroups: true
  xcodeVersion: "26.2"
  fileTypes:
    "icon":
      file: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    # Version numbering for TestFlight and App Store - 
    # MARKETING_VERSION: User-facing version (e.g., 1.0.0, 1.1.0)
    # CURRENT_PROJECT_VERSION: Build number -- increment with each upload (1, 2, 3...)
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "8"
    IPHONEOS_DEPLOYMENT_TARGET: "17.5"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: false
    SWIFT_EMIT_LOC_STRINGS: true
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: true
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true
    ENABLE_USER_SCRIPT_SANDBOXING: true
    DEVELOPMENT_TEAM: ZBZKKWF95G
  
targets:
  JabTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JabTracker
        excludes:
          - "**/.swiftlint.yml"
    resources:
      - path: JabTracker/Assets.xcassets
        optional: true
      - path: JabTracker/AppIcon.icon
        optional: true
      - path: JabTracker/Resources/usda_foods.sqlite
      - path: JabTrackerStoreKit.storekit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.gannonhall.JabTracker
      CODE_SIGN_ENTITLEMENTS: JabTracker/JabTracker.entitlements
      CODE_SIGN_STYLE: Automatic
      INFOPLIST_FILE: JabTracker/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_PREVIEWS: true
      SWIFT_EMIT_LOC_STRINGS: true
      
  JabTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JabTrackerTests
        excludes:
          - "Onboarding/Legacy/**"
    settings:
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: JabTracker

  JabTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [JabTrackerUITests]
    resources:
      - path: JabTrackerStoreKit.storekit
    settings:
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: JabTracker

schemes:
  JabTracker:
    build:
      targets:
        JabTracker: all
        JabTrackerTests: [test]
        JabTrackerUITests: [test]
    test:
      targets:
        - name: JabTrackerTests
          parallelizable: false
        - name: JabTrackerUITests
          parallelizable: true
          randomExecutionOrder: true
      commandLineArguments:
        "--bypass-onboarding": true
        "--force-onboarding": false
        "--reset-app-data": false
        "--ui-testing": true
        "--seed-test-7d": false
        "--seed-test-30d": false
        "--seed-test-90d": false
        "--seed-test-1y": false
        "--seed-test-1y-high": false
        "--seed-test-1y-medium": false
        "--seed-test-1y-low": false
        "--seed-test-new-user": false
        "--seed-check-in-ready": false
        "--seed-check-in-good": false
        "--seed-check-in-minimum": false
        "--seed-check-in-insufficient": false
        "--seed-collaborative": false
    run:
      commandLineArguments:
        "--force-onboarding": false # resets onboarding if true
        "--reset-app-data": true # seeding only works if true
        "--ui-testing": true # Enable to bypasses auth AND auto-complete onboarding
        "--disable-cloudkit": false # Disable iCloud sync for local debugging 
        "--seed-test-7d": false # medication history seeding 
        "--seed-test-30d": false # medication history seeding 
        "--seed-test-90d": false # medication history seeding 
        "--seed-test-1y": false # medication history seeding
        "--test-titration-data": false
        "--seed-test-1y-high": false # 1 year with high quality data (complete daily logging)
        "--seed-test-1y-medium": false # 1 year with medium quality data (4-5 days/week)
        "--seed-test-1y-low": false # 1 year with low quality data (1-2 days/week)
        "--seed-test-new-user": false # new user - today only data
        "--seed-check-in-ready": true  # Seeds goal/program with check-in due (excellent tier)
        "--seed-check-in-good": false  # Seeds goal/program with good data tier
        "--seed-check-in-minimum": false  # Seeds goal/program with minimum data tier
        "--seed-check-in-insufficient": false  # Seeds goal/program with insufficient data (check-in blocked)
        "--seed-collaborative": false  # Use Collaborative program style (default: Coached)
      storeKitConfiguration: JabTrackerStoreKit.storekit