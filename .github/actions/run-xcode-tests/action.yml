name: Run Xcode test lane
description: Run one JabTracker test lane and write its xcresult, log, and source manifest.

inputs:
  destination:
    description: xcodebuild destination
    required: true
  lane:
    description: unit, integration, storekit, or performance
    required: true
  result_name:
    description: Artifact basename written under RUNNER_TEMP
    required: true
  parallel_testing:
    description: YES or NO
    required: false
    default: "NO"
  max_workers:
    description: Maximum parallel test workers when parallel testing is enabled
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Run lane tests
      shell: bash
      run: |
        set -euo pipefail
        ARGS_FILE="$RUNNER_TEMP/${{ inputs.lane }}-xcodebuild-filters.txt"
        python3 scripts/generate-test-manifest.py --print-xcodebuild-args "${{ inputs.lane }}" > "$ARGS_FILE"
        FILTER_ARGS=()
        while IFS= read -r arg; do
          [ -n "$arg" ] || continue
          FILTER_ARGS+=("$arg")
        done < "$ARGS_FILE"
        if [ ${#FILTER_ARGS[@]} -eq 0 ]; then
          echo "No xcodebuild filters generated for lane ${{ inputs.lane }}" >&2
          exit 1
        fi
        if [ "${{ inputs.parallel_testing }}" = "YES" ]; then
          PARALLEL_ARGS=(-parallel-testing-enabled YES)
          if [ -n "${{ inputs.max_workers }}" ]; then
            PARALLEL_ARGS+=(-maximum-parallel-testing-workers "${{ inputs.max_workers }}")
          fi
        else
          PARALLEL_ARGS=(-parallel-testing-enabled NO)
        fi

        set -o pipefail
        xcodebuild test \
          -project JabTracker.xcodeproj \
          -scheme JabTracker \
          -configuration Debug \
          -destination "${{ inputs.destination }}" \
          "${FILTER_ARGS[@]}" \
          -resultBundlePath "$RUNNER_TEMP/${{ inputs.result_name }}.xcresult" \
          -derivedDataPath "$RUNNER_TEMP/DerivedData-${{ inputs.lane }}" \
          -disable-concurrent-destination-testing \
          "${PARALLEL_ARGS[@]}" \
          CODE_SIGNING_ALLOWED=NO \
          | tee "$RUNNER_TEMP/${{ inputs.result_name }}.log"

    - name: Summarize test results
      if: always()
      shell: bash
      run: |
        if [ -d "$RUNNER_TEMP/${{ inputs.result_name }}.xcresult" ]; then
          xcrun xcresulttool get test-results summary \
            --path "$RUNNER_TEMP/${{ inputs.result_name }}.xcresult" \
            --format json | tee -a "$GITHUB_STEP_SUMMARY"
        fi

    - name: Write lane manifest and timing
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/generate-test-manifest.py \
          --output "$RUNNER_TEMP/${{ inputs.result_name }}-manifest.json"
        python3 - <<'PY'
        import json
        import os
        import time
        from pathlib import Path

        start = int(os.environ.get("JOB_START_EPOCH", "0"))
        end = int(time.time())
        payload = {
            "lane": os.environ["LANE_NAME"],
            "result_name": os.environ["RESULT_NAME"],
            "start_epoch": start,
            "end_epoch": end,
            "duration_seconds": end - start if start else None,
        }
        Path(os.environ["TIMING_PATH"]).write_text(json.dumps(payload, indent=2) + "\n")
        PY
      env:
        LANE_NAME: ${{ inputs.lane }}
        RESULT_NAME: ${{ inputs.result_name }}
        TIMING_PATH: ${{ runner.temp }}/${{ inputs.result_name }}-timing.json
