name: Setup Xcode 26.5
description: Select Xcode 26.5 and optionally boot the iOS 26.2 iPhone 17 Pro simulator.

inputs:
  boot_simulator:
    description: Boot the iOS 26.2 iPhone 17 Pro simulator
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Select Xcode 26.5
      shell: bash
      run: |
        set -euo pipefail
        test -d "$XCODE_APP/Contents/Developer"
        sudo xcode-select -s "$XCODE_APP/Contents/Developer"
        xcodebuild -version

    - name: Prepare iOS 26.2 simulator
      if: inputs.boot_simulator == 'true'
      shell: bash
      run: |
        set -euo pipefail
        runtime_id=$(xcrun simctl list runtimes --json | jq -r '
          first(.runtimes[]
            | select(.identifier == "com.apple.CoreSimulator.SimRuntime.iOS-26-2" and .isAvailable == true)
            | .identifier) // empty
        ')
        test -n "$runtime_id"

        device_id=$(xcrun simctl list devices --json | jq -r --arg runtime_id "$runtime_id" '
          first(.devices[$runtime_id][]?
            | select(.name == "iPhone 17 Pro")
            | .udid) // empty
        ')
        if [ -z "$device_id" ]; then
          device_id=$(xcrun simctl create "iPhone 17 Pro" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro \
            "$runtime_id")
        fi

        xcrun simctl boot "$device_id" 2>/dev/null || true
        echo "iOS 26.2 iPhone 17 Pro ready ($device_id)"
