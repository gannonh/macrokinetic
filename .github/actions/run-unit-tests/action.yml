name: Run unit tests
description: Run the JabTracker unit-test suite and publish its xcresult summary.

inputs:
  destination:
    description: xcodebuild destination
    required: true

runs:
  using: composite
  steps:
    - name: Run unit tests
      shell: bash
      run: |
        set -o pipefail
        xcodebuild test \
          -project JabTracker.xcodeproj \
          -scheme JabTracker \
          -configuration Debug \
          -destination "${{ inputs.destination }}" \
          -only-testing:JabTrackerTests \
          -resultBundlePath "$RUNNER_TEMP/unit-tests.xcresult" \
          -derivedDataPath "$RUNNER_TEMP/DerivedData" \
          -disable-concurrent-destination-testing \
          -parallel-testing-enabled NO \
          CODE_SIGNING_ALLOWED=NO \
          | tee "$RUNNER_TEMP/unit-tests.log"

    - name: Summarize unit test results
      if: always()
      shell: bash
      run: |
        if [ -d "$RUNNER_TEMP/unit-tests.xcresult" ]; then
          xcrun xcresulttool get test-results summary \
            --path "$RUNNER_TEMP/unit-tests.xcresult" \
            --format json | tee -a "$GITHUB_STEP_SUMMARY"
        fi
