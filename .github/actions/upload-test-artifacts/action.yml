name: Upload test lane artifacts
description: Upload xcresult, log, manifest, and timing files even when the lane fails or times out.

inputs:
  result_name:
    description: Artifact basename under RUNNER_TEMP
    required: true
  artifact_name:
    description: GitHub Actions artifact name
    required: true

runs:
  using: composite
  steps:
    - name: Upload lane artifacts
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.artifact_name }}
        path: |
          ${{ runner.temp }}/${{ inputs.result_name }}.xcresult
          ${{ runner.temp }}/${{ inputs.result_name }}.log
          ${{ runner.temp }}/${{ inputs.result_name }}-manifest.json
          ${{ runner.temp }}/${{ inputs.result_name }}-timing.json
        if-no-files-found: warn
        retention-days: 7
