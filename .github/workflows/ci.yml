name: CI

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_APP: /Applications/Xcode_26.5.app
  # iOS 26.5's xcodebuild StoreKit test environment returns SKInternalErrorDomain
  # Code=3. Keep CI on the installed 26.2 runtime until that Apple regression is fixed.
  IOS_DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2

jobs:
  pr-checks:
    name: PR checks
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select Xcode 26.5
        run: |
          set -euo pipefail
          test -d "$XCODE_APP/Contents/Developer"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install quality tools
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          command -v swiftlint >/dev/null 2>&1 || brew install swiftlint
          xcodegen --version
          swiftlint version

      - name: Prepare deterministic CI food database
        run: python3 scripts/create-ci-food-database.py JabTracker/Resources/usda_foods.sqlite

      - name: Prepare iOS 26.2 simulator
        run: |
          set -euo pipefail
          runtime_id=$(xcrun simctl list runtimes --json | jq -r '
            first(.runtimes[]
              | select(.identifier == "com.apple.CoreSimulator.SimRuntime.iOS-26-2" and .isAvailable == true)
              | .identifier) // empty
          ')
          test -n "$runtime_id"

          device_id=$(xcrun simctl list devices --json | jq -r --arg runtime_id "$runtime_id" '
            first(.devices[$runtime_id][]?
              | select(.name == "iPhone 17 Pro")
              | .udid) // empty
          ')
          if [ -z "$device_id" ]; then
            device_id=$(xcrun simctl create "iPhone 17 Pro" \
              com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro \
              "$runtime_id")
          fi

          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl list devices available

      - name: Verify generated project is committed
        run: |
          set -euo pipefail
          xcodegen generate
          git diff --check
          git diff --exit-code -- JabTracker.xcodeproj

      - name: Run SwiftLint
        run: swiftlint lint

      - name: Run Python tooling tests
        run: |
          python3 -m compileall -q scripts
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Run unit tests
        uses: ./.github/actions/run-unit-tests
        with:
          destination: ${{ env.IOS_DESTINATION }}

      - name: Upload failed unit test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-tests-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/unit-tests.xcresult
            ${{ runner.temp }}/unit-tests.log
          if-no-files-found: warn
          retention-days: 7
