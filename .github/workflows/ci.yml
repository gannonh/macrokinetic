name: CI

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_APP: /Applications/Xcode_26.5.app
  IOS_DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5
  IPHONEOS_DEPLOYMENT_TARGET: "17.5"

jobs:
  pr-checks:
    name: PR checks
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select Xcode 26.5
        run: |
          set -euo pipefail
          test -d "$XCODE_APP/Contents/Developer"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install quality tools
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          command -v swiftlint >/dev/null 2>&1 || brew install swiftlint
          xcodegen --version
          swiftlint version

      - name: Prepare deterministic CI food database
        run: python3 scripts/create-ci-food-database.py JabTracker/Resources/usda_foods.sqlite

      - name: Verify generated project is committed
        run: |
          set -euo pipefail
          xcodegen generate
          git diff --check
          git diff --exit-code -- JabTracker.xcodeproj

      - name: Run SwiftLint
        run: swiftlint lint

      - name: Run Python tooling tests
        run: |
          python3 -m compileall -q scripts
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project JabTracker.xcodeproj \
            -scheme JabTracker \
            -configuration Debug \
            -destination "$IOS_DESTINATION" \
            -only-testing:JabTrackerTests \
            -resultBundlePath "$RUNNER_TEMP/unit-tests.xcresult" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -disable-concurrent-destination-testing \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET="$IPHONEOS_DEPLOYMENT_TARGET" \
            | tee "$RUNNER_TEMP/unit-tests.log"

      - name: Summarize unit test results
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/unit-tests.xcresult" ]; then
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/unit-tests.xcresult" \
              --format json | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload failed unit test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-tests-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/unit-tests.xcresult
            ${{ runner.temp }}/unit-tests.log
          if-no-files-found: warn
          retention-days: 7
