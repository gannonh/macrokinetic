name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
      
    - name: Show Xcode and Swift versions
      run: |
        xcodebuild -version
        swift --version
        
    - name: Cache Xcode build
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-xcode-${{ hashFiles('**/*.pbxproj') }}
        restore-keys: |
          ${{ runner.os }}-xcode-
          
    - name: Build
      run: |
        xcodebuild build \
          -scheme JabTracker \
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
          -configuration Debug \
          CODE_SIGNING_ALLOWED=NO
          
    - name: Run Unit Tests
      run: |
        xcodebuild test \
          -scheme JabTracker \
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
          -only-testing:JabTrackerTests \
          CODE_SIGNING_ALLOWED=NO
          
    - name: Run UI Tests
      run: |
        xcodebuild test \
          -scheme JabTracker \
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
          -only-testing:JabTrackerUITests \
          CODE_SIGNING_ALLOWED=NO

  lint:
    name: SwiftLint
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Install SwiftLint
      run: brew install swiftlint
      
    - name: Run SwiftLint
      run: swiftlint