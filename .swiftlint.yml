# SwiftLint Configuration

disabled_rules:
  - trailing_whitespace
  - todo
  
opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - implicit_return
  - sorted_first_last
  - vertical_parameter_alignment_on_call

excluded:
  - JabTracker.xcodeproj
  - .build
  - DerivedData

line_length:
  warning: 120
  error: 150

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 400
  error: 500

function_body_length:
  warning: 50
  error: 80

identifier_name:
  min_length: 
    warning: 2
    error: 1
  max_length:
    warning: 40
    error: 50