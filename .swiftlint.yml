# SwiftLint Configuration
#
# Note: Additional SwiftLint configurations exist for specific directories:
# - JabTracker/Services/.swiftlint.yml (allows longer files for complex service classes)
# - JabTracker/Views/.swiftlint.yml (allows longer files for complex SwiftUI views)
# - JabTrackerTests/.swiftlint.yml (allows test-specific patterns like force unwrapping)
# - JabTrackerUITests/.swiftlint.yml (allows UI test-specific patterns)

disabled_rules:
  - trailing_whitespace
  - todo
  - trailing_comma
  - opening_brace
  - closure_parameter_position
  
opt_in_rules:
  - explicit_init
  - first_where
  - force_unwrapping
  - implicit_return
  - sorted_first_last
  - vertical_parameter_alignment_on_call

excluded:
  - JabTracker.xcodeproj
  - .build
  - DerivedData
  - JabTracker/Services/DoseService.swift
  - JabTracker/Views/Nutrition/GoalConfigurationWizard.swift
  - JabTracker/Design/DesignTokens.swift  # Defines colors - cannot use DesignTokens for itself


line_length:
  warning: 120
  error: 150

type_body_length:
  warning: 350
  error: 400

file_length:
  warning: 500
  error: 600

function_body_length:
  warning: 50
  error: 80

cyclomatic_complexity:
  warning: 10
  error: 20
  ignores_case_statements: false

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 40
    error: 50

# Custom rules to enforce design system consistency
# NOTE: Kept as warnings (not errors) to allow builds with legacy violations
# Pre-commit hook uses --strict to block NEW violations in staged files
custom_rules:
  prefer_design_tokens_colors:
    name: "Prefer DesignTokens.Colors"
    regex: 'Color\(\s*\.(system(?!Image)|secondarySystem|tertiarySystem)'
    message: "Use DesignTokens.Colors instead of raw system colors (e.g., DesignTokens.Colors.cardBackground instead of Color(.systemGray6))"
    severity: warning
  prefer_design_tokens_backgrounds:
    name: "Prefer DesignTokens for Backgrounds"
    regex: '\.background\s*\(\s*Color\s*\('
    message: "Use DesignTokens.Colors for backgrounds (e.g., .background(DesignTokens.Colors.cardBackground))"
    severity: warning