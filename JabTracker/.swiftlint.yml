# SwiftLint Configuration for JabTracker root
# AuthenticationManager handles complex seeding scenarios with multiple data tiers
# ContentView handles main app navigation with TDEE backfill integration
# DataController init handles multi-tier storage fallback (CloudKit -> local -> in-memory)

file_length:
  warning: 550  # ContentView includes app launch TDEE snapshot backfill logic
  error: 650

type_body_length:
  warning: 920  # AuthenticationManager seeding logic + Apple credential validation + biometrics
  error: 1000

large_tuple:
  warning: 5
  error: 6

cyclomatic_complexity:
  warning: 15
  error: 20

function_body_length:
  warning: 60  # DataController.init has multi-tier fallback logic
  error: 80

disabled_rules:
  - orphaned_doc_comment  # Comments explain seeding configuration
  - prefer_design_tokens_backgrounds_static  # Color.green for success toast is semantic
