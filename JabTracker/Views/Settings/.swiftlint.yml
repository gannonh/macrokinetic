# SwiftLint overrides for Settings views
# These views contain multiple edit sheets and form sections that increase file length
# AccountView has complex profile editing with HealthKit sync logic

file_length:
  warning: 800
  error: 900

type_body_length:
  warning: 500
  error: 550

function_body_length:
  warning: 70
  error: 80

cyclomatic_complexity:
  warning: 15
  error: 20
