# SwiftLint overrides for Nutrition views
# FoodSearchSheet.swift has complex tab-based UI requiring more lines
# GoalWizard.swift and ProgramWizard.swift contain step views inline per architecture decision
# ProgramWizard.swift has TDEE-to-macro calculation functions added in 15.1-02
# ProgramWizardStepViews.swift contains all step views including CollaborativeDistributionStepView (15.2-04)
# ProgramWizardViewModel extended in 15.2-04 with Collaborative config storage/loading

# Disable design token rules for legacy views pending future refactor
# FoodSearchSheet.swift, BarcodeScannerContentView use older patterns
disabled_rules:
  - prefer_design_tokens_colors
  - prefer_design_tokens_backgrounds
  - prefer_design_tokens_static_colors
  - prefer_design_tokens_backgrounds_static

type_body_length:
  warning: 500
  error: 550

file_length:
  warning: 1300
  error: 1500

# Allow 3-member tuples for macro calculations (protein, fat, carbs)
large_tuple:
  warning: 4

# Extended function body length for complex wizard save/load functions
function_body_length:
  warning: 60
  error: 80

