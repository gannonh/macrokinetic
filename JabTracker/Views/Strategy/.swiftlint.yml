# SwiftLint overrides for Strategy views
# StrategyView.swift contains multiple card components, sheet orchestration,
# weekly macro grid, check-in countdown card with data quality handling,
# and program optimization flow

type_body_length:
  warning: 750
  error: 800

file_length:
  warning: 950
  error: 1050

function_body_length:
  warning: 120
  error: 140

# Pre-existing background color usage - systemGroupedBackground is semantic
disabled_rules:
  - prefer_design_tokens_backgrounds
  - prefer_design_tokens_colors
