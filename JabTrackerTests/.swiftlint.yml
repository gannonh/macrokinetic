disabled_rules:
  - function_body_length
  - force_unwrapping
  - force_try

line_length:
  warning: 150  # Longer lines acceptable for test assertions and setup
  error: 200

file_length:
  warning: 1200  # Comprehensive test suites need more space
  error: 1500  # Allow large test files for coverage

type_body_length:
  warning: 800
  error: 1000