disabled_rules:
  - function_body_length
  - force_unwrapping
  - force_try

line_length:
  warning: 150  # Longer lines acceptable for test assertions and setup
  error: 200

file_length:
  warning: 1400  # Comprehensive test suites need more space
  error: 1600  # Allow large test files for coverage

type_body_length:
  warning: 1000
  error: 1200